plugins {
    id 'com.android.application'
}

android {
    namespace 'com.julian.foldhud'
    compileSdk 34

    defaultConfig {
        applicationId 'com.julian.foldhud'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // personal-use APK: signed with the standard debug key
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
